name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # 允许用 GITHUB_TOKEN 创建 Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      # 防止 tag 与二进制里硬编码的版本不一致
      - name: Verify tag matches source version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CODE_VERSION=$(grep -oP 'const version = "\K[^"]+' cmd/lang-debug-mcp/main.go)
          echo "tag=$TAG_VERSION source=$CODE_VERSION"
          test "$TAG_VERSION" = "$CODE_VERSION" \
            || { echo "::error::tag 与 main.go 的 version 不一致"; exit 1; }

      - name: Test
        run: go test ./...

      - name: Check generated skills
        run: go run ./cmd/skillgen -root . -check

      - name: Build binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -o dist/lang-debug-mcp-linux-amd64   ./cmd/lang-debug-mcp
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -trimpath -o dist/lang-debug-mcp-linux-arm64   ./cmd/lang-debug-mcp
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o dist/lang-debug-mcp-windows-amd64.exe ./cmd/lang-debug-mcp
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -trimpath -o dist/lang-debug-mcp-darwin-amd64  ./cmd/lang-debug-mcp
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -trimpath -o dist/lang-debug-mcp-darwin-arm64  ./cmd/lang-debug-mcp
          ls -lh dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--title "$GITHUB_REF_NAME" --generate-notes --verify-tag)
          [[ "$GITHUB_REF_NAME" == *-* ]] && args+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"
